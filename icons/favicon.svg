<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Callgraphs Generator">
  <!-- callgraphs 生成器：调用图节点 + 箭头 -->
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="64" height="64" fill="#fffff8"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" fill="none" stroke="#111111" stroke-width="1.5"/>
  <!-- 边：入口 → 中间 → 叶子；虚线为间接调用 -->
  <line x1="20.5" y1="41.5" x2="27.5" y2="26.5" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="37" y1="24.5" x2="43.5" y2="35" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="22" y1="45.5" x2="41" y2="42.6" stroke="#111111" stroke-width="1.3" stroke-dasharray="3 2.5" marker-end="url(#ar)"/>
  <!-- 节点：入口深红实心，其余墨线空心 -->
  <circle cx="16" cy="46" r="4.5" fill="#a00000"/>
  <circle cx="32" cy="20" r="4.5" fill="#fffff8" stroke="#111111" stroke-width="1.5"/>
  <circle cx="48" cy="42" r="4.5" fill="#fffff8" stroke="#111111" stroke-width="1.5"/>
</svg>
